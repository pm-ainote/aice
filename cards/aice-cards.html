<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICE 2주 합격 암기카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 레이아웃: 던전 공략집 슬라이드와 같은 남색 바탕 + 호박색 포인트. 한 열 카드 스테이지, 위에 모드와 일차 선택, 아래에 판정 버튼 */
:root {
  --bg: #15152B;
  --panel: #1F1F3D;
  --panel-2: #26264A;
  --fg: #ECE8DC;
  --muted: #A3A0B8;
  --line: #2E2E55;
  --accent: #F5B942;
  --accent-ink: #15152B;
  --accent-text: #F5B942;
  --code-bg: #0E0E1F;
  --code-fg: #EDEAF5;
  --code-dim: #8FA0B8;
  --font-display: 'Jua', 'Noto Sans KR', sans-serif;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
  --font-code: 'Nanum Gothic Coding', 'D2Coding', Consolas, 'Courier New', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F2E8;
    --panel: #FFFDF7;
    --panel-2: #EFE9D8;
    --fg: #26263A;
    --muted: #5E5E72;
    --line: #D9D0BA;
    --accent-text: #8A5A00;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F6F2E8;
  --panel: #FFFDF7;
  --panel-2: #EFE9D8;
  --fg: #26263A;
  --muted: #5E5E72;
  --line: #D9D0BA;
  --accent-text: #8A5A00;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent-text); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vw, 52px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 52ch; }

.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mode {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 8px; font-weight: 500; min-height: 48px;
}
.mode[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

.days { display: flex; flex-wrap: wrap; gap: 8px; }
.days[hidden] { display: none; }
.day {
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-size: 14px; min-height: 36px;
}
.day[aria-pressed="true"] { background: var(--panel-2); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }

.status { display: flex; flex-direction: column; gap: 8px; }
.status-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.status-row b { color: var(--fg); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

.stage { display: flex; flex-direction: column; gap: 16px; }
.flip { display: grid; perspective: 1400px; cursor: pointer; border-radius: 20px; }
.face {
  grid-area: 1 / 1; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
  padding: clamp(18px, 4vw, 32px); display: flex; flex-direction: column; gap: 16px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: transform .45s ease, visibility 0s linear .22s;
}
.face.back { transform: rotateY(180deg); visibility: hidden; border-color: var(--accent); }
.flip.flipped .front { transform: rotateY(-180deg); visibility: hidden; }
.flip.flipped .back { transform: rotateY(0deg); visibility: visible; }
.tag { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent-text); }
.tag span:last-child { color: var(--muted); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.q { font-family: var(--font-display); font-size: clamp(22px, 4.6vw, 28px); line-height: 1.35; margin: 0; text-wrap: balance; }
pre.code {
  margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 14px;
  padding: 18px 20px; font-family: var(--font-code); font-size: clamp(14px, 3.4vw, 17px); line-height: 1.6;
  overflow-x: auto; white-space: pre;
}
.blank { display: inline-block; min-width: 3.2ch; border-bottom: 2px solid #F5B942; color: transparent; user-select: none; line-height: 1.1; }
.ans { color: #F5B942; font-weight: 700; }
.tip { margin: 0; color: var(--muted); font-size: 15px; }
.hint { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { border-radius: 14px; min-height: 56px; font-weight: 700; font-size: 17px; padding: 12px 16px; border: 2px solid var(--line); background: var(--panel); }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.sub-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.link { background: none; border: none; padding: 8px 4px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.live { min-height: 1.6em; margin: 0; font-size: 14px; color: var(--accent-text); }

.done { background: var(--panel); border: 1px dashed var(--line); border-radius: 20px; padding: 32px 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.done h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; }
.done p { margin: 0; color: var(--muted); }

footer { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
footer p { margin: 0; }
.reset-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* 휴대폰: 긴 코드 줄을 접어서 빈칸이 화면 밖으로 나가지 않게 한다 */
@media (max-width: 640px) {
  pre.code { white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; }
}
@media (prefers-reduced-motion: reduce) {
  .face, .bar > i { transition: none; }
}
</style>

<main>
  <header>
    <div class="eyebrow">AICE ASSOCIATE · 2주 합격 플랜</div>
    <h1>AICE 2주 합격 암기카드</h1>
    <p class="lead">빈칸을 채워 말해 보고 카드를 뒤집어 확인한다. 알았다를 누르면 다음 날, 3일 뒤, 7일 뒤에 다시 나온다.</p>
  </header>

  <div class="modes" role="group" aria-label="학습 모드">
    <button class="mode" id="mode-today" type="button" aria-pressed="true">오늘 복습</button>
    <button class="mode" id="mode-day" type="button" aria-pressed="false">일차별</button>
    <button class="mode" id="mode-all" type="button" aria-pressed="false">전체</button>
  </div>
  <div class="days" id="days" role="group" aria-label="일차 선택" hidden></div>

  <section class="status" aria-label="진행 상황">
    <div class="status-row">
      <span id="remain">남은 카드 <b>0</b>장</span>
      <span id="mastered">익힌 카드 <b>0</b>/0</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <section class="stage" id="stage" aria-live="polite"></section>

  <footer>
    <p>복습 기록은 이 브라우저에만 저장된다. 기기를 바꾸면 처음부터 다시 시작한다.</p>
    <div class="reset-row">
      <button class="link" id="reset" type="button">복습 기록 지우기</button>
      <span id="reset-msg" aria-live="polite"></span>
    </div>
    <p>개인 학습용으로 자유롭게 쓰세요. 자료의 재배포·판매는 허용하지 않습니다.</p>
  </footer>
</main>

<script>
(function () {
  // 카드 데이터: ⟦ ⟧ 안의 글자가 빈칸(앞면)이자 정답(뒷면)이다
  var CARDS = [
    { d: 1, q: "scikit-learn을 별칭 sk로 불러온다 (공식 샘플 1번 형식)", t: "별칭은 문제에서 정해 준다. pandas만 외우면 틀린다.",
      c: "import ⟦sklearn⟧ as ⟦sk⟧" },
    { d: 1, q: "data.csv를 변수 data에 읽고 첫 4행을 출력한다 (공식 샘플 2번 형식)", t: "변수 이름과 행 개수를 문제에 적힌 그대로 쓴다. head() 기본은 5행이다.",
      c: "⟦data⟧ = pd.read_csv('data.csv')\ndata.head(⟦4⟧)" },
    { d: 1, q: "df.shape()를 실행했더니 에러가 났다. 고친 코드는?", t: "shape는 함수가 아니라 값이다. 괄호를 붙이면 tuple을 호출하려다 실패한다.",
      c: "# TypeError: 'tuple' object is not callable\ndf.⟦shape⟧" },
    { d: 1, q: "연습 데이터 df.shape의 결과를 예측한다", t: "(행, 열) 순서다. 600행, 6개 컬럼.",
      c: "⟦(600, 6)⟧" },
    { d: 1, q: "비어 있지 않은 값의 개수와 타입을 한 번에 본다 (describe가 아니다)", t: "describe는 숫자 통계, info는 타입과 결측 요약.",
      c: "df.⟦info⟧()" },
    { d: 4, q: "결측치 개수를 세고, 결측이 가장 많은 컬럼 이름을 꺼낸다", t: "idxmax = 가장 큰 값의 이름. 답안 변수에 컬럼 이름을 저장하는 문제에서 쓴다. 연습 데이터는 Age.",
      c: "df.isnull().sum().⟦idxmax⟧()" },
    { d: 2, q: "Sex 값별 개수가 아니라 비율을 본다", t: "normalize=True면 합이 1인 비율이 나온다. 2편 영상에는 없는 옵션이라 이 카드로 익힌다(8편 드릴에 나온다).",
      c: "df['Sex'].value_counts(⟦normalize⟧=True)" },
    { d: 1, q: "컬럼 2개 목록과, male을 0으로 바꾸는 사전을 만든다", t: "list는 대괄호, dict는 중괄호. 콜론으로 짝짓는다.",
      c: "cols = ⟦[⟧'Age', 'Fare'⟦]⟧\nm = ⟦{⟧'male': 0⟦}⟧" },

    { d: 2, q: "df[df['Age'] >= 30 & df['Sex'] == 'female'] 에서 TypeError가 났다. 고친 코드는?", t: "&가 비교보다 먼저 계산된다. 조건마다 괄호로 감싼다.",
      c: "df[⟦(⟧df['Age'] >= 30⟦)⟧ & ⟦(⟧df['Sex'] == 'female'⟦)⟧]" },
    { d: 2, q: "ValueError: The truth value of a Series is ambiguous 가 났다. and 자리에 쓸 것은?", t: "Series끼리는 and, or 대신 &, |를 쓴다.",
      c: "df[(df['Age'] >= 30) ⟦&⟧ (df['Sex'] == 'female')]" },
    { d: 2, q: "Fare가 300 이상인 행을 삭제한다 (공식 샘플 5번 형식)", t: "지울 조건이 아니라 남길 조건을 쓴다. 300 이상 삭제 = 300 미만 남기기.",
      c: "df = df[df['Fare'] ⟦<⟧ 300]" },
    { d: 2, q: "df.drop('RID')에서 KeyError가 났다. RID 컬럼을 지우는 코드는?", t: "drop은 기본이 행 삭제. columns=를 붙이고 결과를 다시 담는다. RID 는 예시 컬럼(연습 데이터에는 없다).",
      c: "df = df.drop(⟦columns⟧=['RID'])" },
    { d: 2, q: "Embarked가 C 또는 Q인 행만 고른다", t: "값이 여러 개면 | 대신 isin.",
      c: "df[df['Embarked'].⟦isin⟧(['C', 'Q'])]" },
    { d: 2, q: "1등석의 Age, Fare만 본다. 쉼표 앞뒤에 무엇이 오나?", t: "loc[행 조건, 컬럼 목록]. 순서를 바꾸면 에러.",
      c: "df.loc[⟦df['Pclass'] == 1⟧, ⟦['Age', 'Fare']⟧]" },
    { d: 2, q: "등급별 요금의 평균과 중앙값을 한 번에 본다", t: "평균과 중앙값이 크게 다르면 이상치를 의심한다.",
      c: "df.groupby('Pclass')['Fare'].⟦agg⟧(['mean', 'median'])" },
    { d: 2, q: "df.corr()에서 ValueError: could not convert string to float: 'male' 이 났다", t: "판다스 2.0부터 글자 컬럼이 섞이면 멈춘다. 숫자 컬럼만 계산하게 한다.",
      c: "df.corr(⟦numeric_only=True⟧)" },
    { d: 2, q: "남성 생존자는 109명. 이게 많은지 판단하려면 무엇을 보나?", t: "개수는 crosstab, 비율은 0/1 컬럼의 평균. 남성 생존율은 29%.",
      c: "df.groupby('Sex')['Survived'].⟦mean⟧()" },
    { d: 2, q: "요금이 비싼 순서로 3명을 본다", t: "기본은 작은 값부터. 정렬은 이상치를 찾는 가장 빠른 방법.",
      c: "df.sort_values('Fare', ascending=⟦False⟧).⟦head⟧(3)" },


    { d: 3, q: "모델에 넣었더니 Input X contains NaN 에러. 먼저 칠 코드는?", t: "결측치 = 비어 있는 칸. 컬럼별 빈칸 수부터 센다. 연습 데이터는 Age 118, Embarked 2.",
      c: "df.⟦isnull⟧().⟦sum⟧()" },
    { d: 3, q: "결측치가 있는 행을 모두 지우고 확인한다 (샘플 6번 빈칸 2개)", t: "600행이 480행으로. 지운 뒤 isnull().sum() 으로 다시 확인.",
      c: "print(df.⟦isnull⟧().sum())\ndf_na = df.⟦dropna⟧()\nprint(df_na.isnull().sum())" },
    { d: 3, q: "숫자 결측을 채울 때 평균 대신 쓰는 값과 코드는? (요금 평균 37, 중앙값 17.65)", t: "중앙값 = 줄 세웠을 때 한가운데 값. 비싼 표 몇 장이 평균을 끌어올린다. 나이는 평균과 중앙값이 거의 같지만 습관처럼 중앙값을 쓴다.",
      c: "df['Age'] = df['Age'].⟦fillna⟧(df['Age'].⟦median⟧())" },
    { d: 3, q: "fillna(df['Embarked'].mode()) 는 에러 없이 빈칸이 그대로 남았다. 고친 코드는?", t: "mode() 는 값이 아니라 목록을 돌려준다. 대괄호 0 으로 첫 값을 꺼낸다.",
      c: "df['Embarked'] = df['Embarked'].fillna(df['Embarked'].mode()⟦[0]⟧)" },
    { d: 3, q: "IQR 울타리를 만든다. 빈칸 4개는? (샘플 5번 변수 이름)", t: "q1 = 아래 4분의 1 지점, q3 = 위 4분의 1 지점, 그 간격이 IQR. 1.5 는 고정 숫자.",
      c: "q1 = df['Fare'].quantile(⟦0.25⟧)\nq3 = df['Fare'].quantile(⟦0.75⟧)\niqr = q3 - q1\nlower_fence = q1 - ⟦1.5⟧ * iqr\nupper_fence = q3 + ⟦1.5⟧ * iqr" },
    { d: 3, q: "울타리 밖 행을 지운다 (샘플 5번 빈칸 2개). 지우기 전에 볼 것은?", t: "index = 행마다 붙은 번호표. 지울 행의 번호표를 drop 에 넘긴다. 지우기 전에 df[cond] 로 누가 지워지는지 본다. 연습 데이터는 52명 중 49명이 1등석이었다.",
      c: "df_temp = df.⟦drop⟧(df[cond].⟦index⟧, axis=0)" },
    { d: 3, q: "행을 지운 뒤 번호표를 0부터 다시 매긴다. reset_index(drop=True) 만 쓰면?", t: "대입도 inplace 도 없으면 아무것도 안 바뀐다(마지막 번호 599 그대로). drop=True 가 없으면 index 컬럼이 생긴다.",
      c: "df_temp.⟦reset_index⟧(⟦drop=True⟧, ⟦inplace=True⟧)" },
    { d: 3, q: "Embarked 의 C, Q 를 'other' 하나로 바꾼다 (샘플 7번 형식)", t: "loc[행 조건, 컬럼] = 새 값. 2편의 loc 은 보기, 오늘은 바꾸기. 바꾼 뒤 value_counts 로 확인.",
      c: "df.⟦loc⟧[df['Embarked'].⟦isin⟧(['C', 'Q']), ['Embarked']] = 'other'\ndf['Embarked'].⟦value_counts⟧()" },
    { d: 3, q: "df.drop(['Fare'], axis=0) 에서 KeyError. 고친 코드는? (샘플 7번 오류 정정)", t: "axis=0 은 행, axis=1 은 컬럼. 행 번호표에서 Fare 를 찾으니 KeyError.",
      c: "df = df.drop(['Fare'], axis=⟦1⟧)" },
    { d: 3, q: "글자 컬럼을 찾고, 값 2개는 map, 여럿은 원 핫 인코딩한 뒤 확인한다 (샘플 7번)", t: "object = 글자 컬럼. get_dummies 는 값마다 컬럼을 만든다(판다스 2는 True/False). pd.one_hot_encoding 같은 함수는 없다.",

    { d: 6, q: "학습 loss 는 계속 내려가는데 검증 loss 가 올라가기 시작했다. 무슨 뜻?", t: "외우기(과적합) 시작. EarlyStopping 이 이걸 보고 멈춘다. 연습 데이터에서 딥러닝 63.3%, 랜덤포레스트 64.4% - 딥러닝이 늘 더 좋은 건 아니다.",

  ];
  var DAYS = ['입문', '분석', '전처리', '시각화', '머신러닝', '딥러닝', '총정리'];
  var KEY = 'aice-dungeon-cards-v2';
  var START_KEY = 'aice-cards-start';
  var INTERVALS = [1, 3, 7];

  // 복습 기록 불러오기 (저장소를 못 쓰는 환경에서도 동작한다)
  var recs = {};
  try { recs = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { recs = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(recs)); } catch (e) {} }

  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function addDays(s, n) { var p = s.split('-').map(Number); return ymd(new Date(p[0], p[1] - 1, p[2] + n)); }
  function startDay() {
    // 처음 연 날을 Day 1 로 삼는다 (저장소를 못 쓰면 오늘)
    var s = null;
    try { s = localStorage.getItem(START_KEY); if (!s) { s = today(); localStorage.setItem(START_KEY, s); } } catch (e) { s = today(); }
    return s;
  }
  function openDay() {
    var p = startDay().split('-').map(Number);
    var s = new Date(p[0], p[1] - 1, p[2]);
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var diff = Math.floor((t - s) / 86400000);
    return Math.max(1, Math.min(7, diff + 1));
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function codeHtml(code, back) {
    return esc(code).replace(/⟦(.*?)⟧/g, function (m, a) {
      return back ? '<span class="ans">' + a + '</span>' : '<span class="blank">' + a + '</span>';
    });
  }

  var state = { mode: 'today', day: 1, queue: [], flipped: false };
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  function buildQueue() {
    var t = today(), od = openDay(), q = [];
    CARDS.forEach(function (c, i) {
      var r = recs[i];
      if (state.mode === 'today') { if (c.d <= od && (!r || r.due <= t)) q.push(i); }
      else if (state.mode === 'day') { if (c.d === state.day) q.push(i); }
      else q.push(i);
    });
    state.queue = q;
    state.flipped = false;
  }

  function masteredCount() {
    var n = 0;
    for (var k in recs) { if (recs[k] && recs[k].n >= 1) n++; }
    return n;
  }

  function renderStatus() {
    $('remain').innerHTML = '남은 카드 <b>' + state.queue.length + '</b>장';
    var m = masteredCount();
    $('mastered').innerHTML = '익힌 카드 <b>' + m + '</b>/' + CARDS.length;
    $('bar').style.width = (m / CARDS.length * 100) + '%';
  }

  function renderDays() {
    var box = $('days');
    box.hidden = state.mode !== 'day';
    if (box.hidden) return;
    box.innerHTML = DAYS.map(function (n, i) {
      return '<button class="day" type="button" data-day="' + (i + 1) + '" aria-pressed="' + (state.day === i + 1) + '">DAY ' + (i + 1) + ' ' + n + '</button>';
    }).join('');
  }

  function nextDueText() {
    var t = today(), best = null;
    for (var k in recs) { if (recs[k] && recs[k].due > t && (!best || recs[k].due < best)) best = recs[k].due; }
    if (!best) return '';
    var p = best.split('-').map(Number);
    return '다음 복습은 ' + p[1] + '월 ' + p[2] + '일이다.';
  }

  function renderStage() {
    if (!state.queue.length) {
      var msg = state.mode === 'today'
        ? '오늘 복습할 카드를 모두 끝냈다. ' + nextDueText() + ' 더 외우고 싶으면 일차별 모드를 쓴다.'
        : '이 묶음의 카드를 모두 익혔다. 처음부터 다시 돌려도 좋다.';
      stage.innerHTML = '<div class="done"><h2>' + (state.mode === 'today' ? '오늘 복습 끝' : '한 바퀴 완료') + '</h2><p>' + msg + '</p>' +
        '<button class="btn go" id="restart" type="button">' + (state.mode === 'today' ? '일차별로 가기' : '처음부터 다시') + '</button></div>';
      return;
    }
    var id = state.queue[0], c = CARDS[id];
    stage.innerHTML =
      '<div class="flip' + (state.flipped ? ' flipped' : '') + '" id="flip" role="button" tabindex="0" aria-label="카드 뒤집기">' +
        '<div class="face front">' +
          '<div class="tag"><span>DAY ' + c.d + ' · ' + DAYS[c.d - 1] + '</span><span>카드 ' + (id + 1) + '/' + CARDS.length + '</span></div>' +
          '<p class="q">' + esc(c.q) + '</p>' +
          '<pre class="code">' + codeHtml(c.c, false) + '</pre>' +
          '<p class="hint">빈칸을 말해 본 뒤 카드를 눌러 정답을 확인한다</p>' +
        '</div>' +
        '<div class="face back">' +
          '<div class="tag"><span>정답</span><span>카드 ' + (id + 1) + '/' + CARDS.length + '</span></div>' +
          '<pre class="code">' + codeHtml(c.c, true) + '</pre>' +
          '<p class="tip">' + esc(c.t) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn" id="again" type="button">다시 (1)</button>' +
        '<button class="btn go" id="known" type="button">알았다 (2)</button>' +
      '</div>' +
      '<div class="sub-actions"><button class="link" id="skip" type="button">건너뛰기</button><p class="live" id="live"></p></div>';
    $('again').disabled = !state.flipped;
    $('known').disabled = !state.flipped;
  }

  function renderAll() { renderDays(); renderStatus(); renderStage(); }

  function flip() {
    if (!state.queue.length) return;
    state.flipped = !state.flipped;
    var f = $('flip');
    if (f) f.classList.toggle('flipped', state.flipped);
    $('again').disabled = !state.flipped;
    $('known').disabled = !state.flipped;
  }

  function mark(ok) {
    if (!state.queue.length || !state.flipped) return;
    var id = state.queue.shift(), t = today(), r = recs[id] || { n: 0, due: t }, text;
    if (ok) {
      r.n = r.n + 1;
      var days = INTERVALS[Math.min(r.n, INTERVALS.length) - 1];
      r.due = addDays(t, days);
      text = days === 1 ? '다음 복습은 내일이다.' : '다음 복습은 ' + days + '일 뒤이다.';
    } else {
      r.n = 0; r.due = t;
      state.queue.push(id);
      text = '오늘 한 번 더 나온다.';
    }
    recs[id] = r; save();
    state.flipped = false;
    renderStatus(); renderStage();
    var live = $('live'); if (live) live.textContent = text;
  }

  function skip() {
    if (state.queue.length < 2) return;
    state.queue.push(state.queue.shift());
    state.flipped = false;
    renderStage();
  }

  function setMode(m) {
    state.mode = m;
    ['today', 'day', 'all'].forEach(function (k) { $('mode-' + k).setAttribute('aria-pressed', String(k === m)); });
    buildQueue(); renderAll();
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('#flip')) return flip();
    if (t.id === 'again') return mark(false);
    if (t.id === 'known') return mark(true);
    if (t.id === 'skip') return skip();
    if (t.id === 'restart') { if (state.mode === 'today') return setMode('day'); buildQueue(); return renderAll(); }
    var d = t.closest('.day');
    if (d) { state.day = Number(d.getAttribute('data-day')); buildQueue(); renderAll(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && t.id === 'flip' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); return flip(); }
    if (t && (t.tagName === 'BUTTON' || t.tagName === 'INPUT')) return;
    if (e.key === '1') mark(false);
    else if (e.key === '2') mark(true);
    else if (e.key === ' ') { e.preventDefault(); flip(); }
  });

  $('mode-today').addEventListener('click', function () { setMode('today'); });
  $('mode-day').addEventListener('click', function () { state.day = Math.min(state.day, openDay()) || 1; setMode('day'); });
  $('mode-all').addEventListener('click', function () { setMode('all'); });

  // 기록 지우기: 확인 단계를 페이지 안에 둔다
  var armed = false;
  $('reset').addEventListener('click', function () {
    var msg = $('reset-msg');
    if (!armed) { armed = true; msg.textContent = '한 번 더 누르면 모든 복습 기록이 지워진다.'; return; }
    recs = {}; save(); armed = false; msg.textContent = '복습 기록을 지웠다.';
    buildQueue(); renderAll();
  });

  state.day = openDay();
  buildQueue();
  renderAll();
})();
</script>
